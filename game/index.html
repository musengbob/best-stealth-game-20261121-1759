<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift: The Quiet Courier</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141a2e'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23ffd94d'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070a14;
    color: #e8ecf5;

    min-height: 100vh;
    display: flex;
    flex-direction: column;

    display: block;

    border: 1px solid #2c3550;
    border-radius: 6px;
  }

    font-size: 13px;
    color: #8b96b0;
    text-align: center;
  }
</style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <div class="hint">WASD / arrows — move &nbsp;·&nbsp; Shift — sneak &nbsp;·&nbsp; Space — dash &nbsp;·&nbsp; P — pause &nbsp;·&nbsp; M — mute &nbsp;·&nbsp; R — restart</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
